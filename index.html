<style>
/* Layout: sidebar on wide screens, bottom tab bar on phones; one working column; chains are the one bold gold element */
:root{
  --accent-base:#2F5D50; --chain-base:#A8823A; --q1-base:#A9524A; --q2-base:#4C6A8C; --q3-base:#A88438; --q4-base:#8A8D93;
  --bg:#F3F3F1; --surface:#FFFFFF; --surface2:#EFEFEC; --ink:#1C1D1F; --muted:#6C6E73; --line:#E3E3DF; --danger:#B4473F;
  --accent:var(--accent-base); --chain:var(--chain-base);
  --q1:var(--q1-base); --q2:var(--q2-base); --q3:var(--q3-base); --q4:var(--q4-base);
  --shadow:0 1px 2px rgba(20,20,22,.04),0 10px 30px rgba(20,20,22,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111213; --surface:#1A1B1D; --surface2:#222326; --ink:#ECECE9; --muted:#9B9DA2; --line:#2C2E31; --danger:#E0756C;
  --accent:color-mix(in srgb,var(--accent-base) 62%,#fff); --chain:color-mix(in srgb,var(--chain-base) 75%,#fff);
  --q1:color-mix(in srgb,var(--q1-base) 70%,#fff); --q2:color-mix(in srgb,var(--q2-base) 65%,#fff); --q3:color-mix(in srgb,var(--q3-base) 75%,#fff); --q4:color-mix(in srgb,var(--q4-base) 85%,#fff);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111213; --surface:#1A1B1D; --surface2:#222326; --ink:#ECECE9; --muted:#9B9DA2; --line:#2C2E31; --danger:#E0756C;
  --accent:color-mix(in srgb,var(--accent-base) 62%,#fff); --chain:color-mix(in srgb,var(--chain-base) 75%,#fff);
  --q1:color-mix(in srgb,var(--q1-base) 70%,#fff); --q2:color-mix(in srgb,var(--q2-base) 65%,#fff); --q3:color-mix(in srgb,var(--q3-base) 75%,#fff); --q4:color-mix(in srgb,var(--q4-base) 85%,#fff);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.3); color-scheme:dark}
:root{
  --teal:var(--accent); --teal-soft:color-mix(in srgb,var(--accent) 11%,var(--surface));
  --gold:var(--chain); --gold-soft:color-mix(in srgb,var(--chain) 14%,var(--surface)); --gold-ink:color-mix(in srgb,var(--chain) 55%,var(--ink));
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.auth{position:fixed;inset:0;background:var(--bg);z-index:80;display:grid;place-items:center;padding:24px 16px;overflow:auto}
.auth .box{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px}
.auth .err{color:var(--danger);font-weight:600;font-size:14px}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--q2);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

#app{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
main{padding:12px 16px 110px;max-width:880px;width:100%;margin:0 auto;min-width:0}
@media (min-width:900px){
  #app{grid-template-columns:232px 1fr}
  .side{display:flex;flex-direction:column;gap:6px;padding:22px 14px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;background:var(--surface)}
  .tabbar{display:none!important}
  main{padding:22px 32px 60px}
  .fab{bottom:28px!important;right:32px!important}
}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;padding:4px 8px 16px}
.brand svg{width:30px;height:30px}
.navbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;background:none;border-radius:10px;text-align:left;font-weight:600;color:var(--muted)}
.navbtn svg{width:20px;height:20px;flex:none}
.navbtn[aria-current="true"]{background:var(--surface2);color:var(--ink)}
.navbtn:hover{color:var(--ink)}
.store{margin-top:auto;font-size:12px;color:var(--muted);padding:8px 10px;border-radius:10px;background:var(--surface2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
.dot.on{background:var(--teal)}

.quick{position:fixed;inset:0;background:var(--bg);z-index:75;display:flex;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.qbox{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px}
.qtop{display:flex;align-items:center;gap:10px}
.qtitle{font-family:var(--f-display);font-weight:800;font-size:22px}
.qcount{margin-left:auto;color:var(--teal);font-weight:700;font-size:14px}
.qinp{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:16px;font-size:22px;line-height:1.35;font-weight:500;resize:none;color:var(--ink)}
.qinp:focus{outline:none;border-color:var(--ink)}
.qsend{padding:16px;font-size:17px;border-radius:14px}
.qdone{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--teal);font-weight:800;font-size:17px}
.qdone svg{width:22px;height:22px}
.qdone.pop{animation:clink .4s ease-out}
.trow{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);min-width:0}
.trow.planned{background:var(--teal-soft);border-color:color-mix(in srgb,var(--teal) 35%,var(--line));border-left-color:var(--teal)}
.trow.done{opacity:.55}
.trow.done .t{text-decoration:line-through}
.trow .body{flex:1;min-width:0;cursor:pointer}
.trow .t{font-weight:600;overflow-wrap:anywhere}
.trow .m{font-size:12.5px;color:var(--muted)}
.trow.planned .m{color:var(--teal);font-weight:600}
.trow .plan{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:-4px 0 10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.dl{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.dl.soon{background:color-mix(in srgb,var(--q3) 18%,transparent);color:var(--gold-ink)}
.dl.late{background:color-mix(in srgb,var(--q1) 15%,transparent);color:var(--danger)}
.pchip{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:6px;color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,transparent);white-space:nowrap}
.pbar{height:6px;border-radius:4px;background:var(--surface2);overflow:hidden;flex:1;min-width:40px}
.pbar i{display:block;height:100%;border-radius:4px;transition:width .3s}
.pline{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;font-weight:700;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.pcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pcard .ptop{display:flex;align-items:center;gap:8px}
.pcard b{font-family:var(--f-display);font-size:17px;flex:1;min-width:0;overflow-wrap:anywhere}
.pcard .ppct{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.pcard .m{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pdot{width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none;display:inline-block}
.prow{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.prow .check{margin-top:1px}
.prow .body{flex:1;min-width:0;cursor:pointer}
.prow .t{font-weight:600;overflow-wrap:anywhere}
.prow .m{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.prow.done .t{text-decoration:line-through;color:var(--muted)}
.prow.planned{border-left:4px solid var(--teal)}
.planned-tag{font-size:11.5px;font-weight:700;color:var(--teal)}
.plan{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.dscrim{position:fixed;inset:0;background:rgba(10,14,22,.35);z-index:55}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(88vw,380px);background:var(--surface);z-index:56;box-shadow:-8px 0 30px rgba(0,0,0,.18);transform:translateX(105%);transition:transform .22s ease-out;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;overflow-y:auto;border-radius:18px 0 0 18px}
.drawer.open{transform:none}
.dhead{display:flex;align-items:center;gap:10px}
.dhead b{font-family:var(--f-display);font-size:20px}
.dhead .iconbtn{margin-left:auto}
.nlist{display:flex;flex-direction:column;gap:6px}
.nitem{display:flex;align-items:flex-start;gap:10px;padding:10px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.nitem .check{width:24px;height:24px;border-width:2px}
.nitem .check svg{width:13px;height:13px}
.nitem .ntext{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;cursor:text;padding-top:1px}
.nitem.done .ntext{text-decoration:line-through;color:var(--muted)}
.nitem.editing{flex-direction:column;align-items:stretch}
.nitem{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;align-items:center}
.nitem.group{background:var(--surface);border-color:color-mix(in srgb,var(--gold) 45%,var(--line))}
.nitem.group .ntext{font-weight:700}
.nitem.moving{outline:2px dashed var(--gold);opacity:.6}
.nitem.target{outline:2px dashed color-mix(in srgb,var(--teal) 70%,transparent);cursor:pointer}
.ntog{width:24px;height:24px;border:0;background:none;padding:0;color:var(--muted);flex:none;display:grid;place-items:center}
.ntog svg{width:16px;height:16px}
.ncount{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--muted);background:var(--surface2);border-radius:6px;padding:1px 6px}
.nmenu{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.nmenu button{border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:12px 14px;font-weight:600;font-size:14.5px}
.nmenu button:last-child{border-bottom:0;color:var(--muted)}
.nmenu .danger{color:var(--danger)}
.movebar{background:var(--gold-soft);color:var(--gold-ink);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.dhandle{position:fixed;right:0;top:42%;width:12px;height:72px;border:0;border-radius:10px 0 0 10px;background:var(--gold);opacity:.75;z-index:22;padding:0}
.dhandle:active{width:18px}
@media (min-width:900px){.dhandle{width:14px}}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.tabbar svg{width:22px;height:22px}
.tabbar button[aria-current="true"]{color:var(--ink)}
.tabbar button[aria-current="true"] svg{color:var(--gold)}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:#fff;box-shadow:var(--shadow);display:grid;place-items:center;z-index:21;transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab svg{width:26px;height:26px}

/* refined surfaces */
.row,.trow,.prow,.rcard,.pcard,.quad,.dayblock,.mcard,.card,.summary{border-color:var(--line);box-shadow:0 1px 0 rgba(0,0,0,.02)}
.row,.trow,.prow{border-radius:14px}
.sec h2{font-weight:600;letter-spacing:.12em;font-size:11.5px}
.head h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
.tabbar{background:color-mix(in srgb,var(--surface) 82%,transparent)!important;-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.tabbar button[aria-current="true"] svg{color:var(--accent)!important}
.tabbar button[aria-current="true"]{position:relative}
.tabbar button[aria-current="true"]::after{content:"";position:absolute;top:-6px;width:18px;height:3px;border-radius:2px;background:var(--accent)}
[data-lp]{-webkit-touch-callout:none}
.tabbar button,.navbtn,.sec h2{-webkit-user-select:none;user-select:none}
.motiv{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:6px}
.mring{width:78px;height:78px;border:0;background:none;padding:0;position:relative}
.mring svg{width:78px;height:78px;display:block}
.mring .c{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.1;text-align:center}
.mring .c small{display:block;font-family:var(--f-body);font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.mt{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.25;text-wrap:balance}
.ms{font-size:12.5px;color:var(--muted);margin-top:2px}
.week{display:flex;gap:6px;margin-top:10px}
.week span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;color:var(--muted);font-weight:600}
.week i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);display:block}
.week i.part{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 30%,transparent)}
.week i.full{border-color:var(--accent);background:var(--accent)}
.week i.today{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.mstreak{text-align:center;min-width:44px}
.mstreak b{display:block;font-family:var(--f-display);font-size:28px;line-height:1;color:var(--gold-ink)}
.mstreak span{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
@media (max-width:380px){.motiv{grid-template-columns:auto 1fr}.mstreak{display:none}}
.qstat{text-align:center;color:var(--muted);font-size:14px}
.qstat b{color:var(--ink)}
.lpmenu{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lpmenu button{border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:15px 16px;text-align:left;font-weight:600;font-size:15.5px;display:flex;align-items:center;gap:10px}
.lpmenu button:last-child{border-bottom:0}
.sw{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.sw button{aspect-ratio:1;max-width:100%;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);background:var(--c)}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.colorrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.colorrow:last-child{border-bottom:0}
.colorrow .dotc{width:26px;height:26px;border-radius:50%;background:var(--c);border:0;flex:none;box-shadow:0 0 0 1px var(--line)}
.colorrow span{flex:1}
.hidrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.hidrow:last-child{border-bottom:0}
.hidrow span{flex:1;font-weight:600}
.sugcard{display:flex;gap:12px;align-items:center;background:var(--teal-soft);border-radius:14px;padding:12px}
.mealday{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mealday.today{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.mealday.past{opacity:.6}
.mdh{display:flex;align-items:baseline;gap:8px}
.mdh b{font-family:var(--f-display);font-size:17px}
.mslot{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:start}
.mlabel{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:7px}
.mitems{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.mchip{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:6px 10px;font-size:14px;font-weight:600;text-align:left;max-width:100%;overflow-wrap:anywhere}
.madd{border:1px dashed var(--line);background:none;border-radius:10px;width:34px;height:32px;color:var(--muted);font-size:18px;line-height:1}
.mmonth{display:flex;flex-direction:column;gap:4px}
.mrow{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
.mrow.today{border-color:var(--accent)}
.mdate{display:flex;flex-direction:column;align-items:center;width:30px;flex:none}
.mdate b{font-family:var(--f-display);font-size:17px;line-height:1}
.mdate small{font-size:10px;color:var(--muted);font-weight:600}
.msum{display:flex;flex-direction:column;gap:1px;font-size:13px;min-width:0}
.ms-slot b{color:var(--muted);font-weight:700;margin-right:4px}
.mealtoday{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.mealtoday .mlabel{display:inline-block;width:76px;padding-top:0}
.topbar{display:flex;align-items:center;gap:10px;margin:-2px 0 10px}
.topbar .menubtn{border:0;background:none;width:40px;height:36px;margin-left:-8px}
.topbar .menubtn svg{width:22px;height:22px}
.tbrand{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em}
@media (min-width:900px){.topbar{display:none}}
.ldrawer{position:fixed;top:0;left:0;bottom:0;width:min(82vw,320px);background:var(--surface);z-index:56;box-shadow:8px 0 30px rgba(0,0,0,.18);transform:translateX(-105%);transition:transform .22s ease-out;padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:2px;overflow-y:auto;border-radius:0 18px 18px 0}
.ldrawer.open{transform:none}
.ldrawer .dhead{margin-bottom:8px}
.lsec{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:14px 8px 6px}
.lnav{display:flex;align-items:center;gap:12px;padding:11px 10px;border:0;background:none;border-radius:12px;text-align:left;font-weight:600;font-size:15.5px;color:var(--ink);-webkit-user-select:none;user-select:none}
.lnav svg{width:21px;height:21px;color:var(--muted);flex:none}
.lnav[aria-current="true"]{background:var(--surface2)}
.lnav[aria-current="true"] svg{color:var(--accent)}
.hidrow .seg button{padding:6px 10px;font-size:12.5px}
/* clocks */
.clocks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:10px}
.clock{background:none;border:0;border-left:1px solid var(--line);padding:2px 10px;text-align:left;min-width:0}
.clock:first-child{border-left:0;padding-left:0}
.clock .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.clock .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock .s{font-size:11px;color:var(--accent);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock .bar{height:3px;border-radius:2px;background:var(--surface2);margin-top:6px;overflow:hidden}
.clock .bar{display:flex}
.clock .bar i{display:block;height:100%;background:var(--ink);opacity:.55}
.clock .bar b{display:block;height:100%;background:var(--accent)}
@media (max-width:420px){.clock .v{font-size:12.5px;letter-spacing:-.02em}.clock{padding:7px 7px}.clocks{gap:6px}}

/* headings & sections */
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.head h1{font-size:26px;flex:1;min-width:0}
.sub{color:var(--muted);font-size:13.5px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sec{margin:18px 0 8px;display:flex;align-items:baseline;gap:8px}
.sec h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-family:var(--f-body);font-weight:700}
.sec .add{margin-left:auto;border:0;background:none;color:var(--q2);font-weight:600;font-size:13.5px}
.list{display:flex;flex-direction:column;gap:6px}
.empty{color:var(--muted);font-size:14px;padding:12px 14px;border:1px dashed var(--line);border-radius:12px}

/* rows */
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.row .body{flex:1;min-width:0;cursor:pointer}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .m{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.check{width:28px;height:28px;flex:none;border-radius:50%;border:2.5px solid var(--qc,var(--q4));background:transparent;display:grid;place-items:center;transition:transform .15s,background .2s}
.check svg{width:16px;height:16px;opacity:0;color:#fff}
.check.on{background:var(--qc,var(--q4))}
.check.on svg{opacity:1}
.check:active{transform:scale(.88)}
.qtag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;color:var(--qc);background:color-mix(in srgb,var(--qc) 13%,transparent)}
.timecol{font-family:var(--f-mono);font-size:13px;font-weight:600;width:48px;flex:none;color:var(--muted)}
.nowline{display:flex;align-items:center;gap:8px;color:var(--danger);font-size:12px;font-weight:700;font-family:var(--f-mono)}
.nowline::after{content:"";flex:1;height:2px;background:var(--danger);border-radius:2px}

/* routine ring button */
.rbtn{width:44px;height:44px;flex:none;border:0;background:none;padding:0;position:relative}
.rbtn svg{width:44px;height:44px}
.rbtn .n{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;font-family:var(--f-mono)}
.link{display:inline-flex;align-items:center;gap:3px;color:var(--gold-ink);font-weight:700}
.link svg{width:14px;height:14px}
.rrow{border-left:4px solid var(--rc)}

/* banners */
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--gold-soft);color:var(--gold-ink);margin-bottom:8px;border:0;width:100%;text-align:left;font-weight:600}
.banner.blue{background:color-mix(in srgb,var(--q2) 14%,var(--surface));color:var(--ink)}
.banner svg{width:20px;height:20px;flex:none}
.banner span{flex:1}

/* summary */
.summary{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:6px}
.summary svg{width:64px;height:64px;flex:none}
.summary .big{font-family:var(--f-display);font-size:22px;font-weight:700}

/* routine cards */
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rcard .top{display:flex;gap:10px;align-items:flex-start}
.rcard .nm{font-family:var(--f-display);font-weight:700;font-size:18px;overflow-wrap:anywhere}
.streak{display:flex;align-items:baseline;gap:6px}
.streak b{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--gold-ink)}
.chain{width:100%;height:34px;display:block}
.chain .lk{fill:none;stroke-width:4}
.paused{opacity:.55}

/* matrix */
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.matrix{grid-template-columns:1fr}}
.quad{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--qc);border-radius:var(--r);padding:12px;min-width:0;display:flex;flex-direction:column;gap:8px}
.quad h3{font-size:16px}
.quad .hint{font-size:12.5px;color:var(--muted)}
.quad .row{background:var(--surface2)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;text-align:center;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.cell{aspect-ratio:1/1;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.cell.out{opacity:.4}
.cell.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.cell.sel{background:var(--ink);color:var(--bg)}
.cell .d{font-weight:700;font-size:13px}
.cell .dots{display:flex;gap:2px;flex-wrap:wrap}
.cell .dots i{width:6px;height:6px;border-radius:50%}
.cell .c{font-size:10px;color:var(--muted);margin-top:auto}
.cell.sel .c{color:inherit}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left}
.mcard b{font-family:var(--f-display);font-size:17px;display:block}
.mcard .bar{height:4px;background:var(--surface2);border-radius:2px;margin-top:8px;overflow:hidden}
.mcard .bar i{display:block;height:100%;background:var(--teal)}
.mcard.cur{border-color:var(--gold)}
.dayblock{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.dayblock .dh{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;width:100%;text-align:left;font-weight:700;margin-bottom:6px}
.dayblock .dh .sub{font-weight:500;margin-left:auto}
.dayblock.today{border-color:var(--gold)}
.mini{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px;min-width:0}
.mini .t{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.mini .check{width:22px;height:22px;border-width:2px}
.mini .check svg{width:12px;height:12px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out;display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px;padding:22px}}
.sheet h2{font-size:21px}
.sheet .x{margin-left:auto}
.shead{display:flex;align-items:center;gap:8px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.inp{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:11px;padding:11px 12px;font-size:16px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink)}
.inp.big{font-size:20px;padding:14px}
textarea.inp{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.inp{min-width:0;max-width:100%}
@media (max-width:420px){.grid2.stack{grid-template-columns:1fr}}
.qpick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qpick button{border:2px solid var(--line);background:var(--surface2);border-radius:11px;padding:9px 10px;text-align:left;font-size:13px;font-weight:700;color:var(--ink)}
.qpick button small{display:block;font-weight:500;color:var(--muted)}
.qpick button[aria-pressed="true"]{border-color:var(--qc);background:color-mix(in srgb,var(--qc) 12%,var(--surface))}
.toggle{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:600;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--teal)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--surface2);border:1px solid var(--line)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.gold{background:var(--gold);color:#1d1400;border-color:var(--gold)}
.btn.danger{color:var(--danger)}
.btn.grow{flex:1}
.typegrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.typegrid button{border:2px solid var(--line);background:var(--surface2);border-radius:11px;padding:9px;text-align:left;font-size:13.5px;font-weight:600}
.typegrid button small{display:block;color:var(--muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em}
.typegrid button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;background:var(--c)}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.wdpick{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wdpick button{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:8px 0;font-size:12.5px;font-weight:700}
.wdpick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mdpick{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mdpick button{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:6px 0;font-size:12.5px;font-family:var(--f-mono)}
.mdpick button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pend{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.pend .btns .btn{padding:8px 12px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3{font-size:18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.taglist{display:flex;gap:6px;flex-wrap:wrap}
.code{font-family:var(--f-mono);font-size:12px;width:100%;min-height:90px}

#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:up .2s;pointer-events:auto;display:flex;gap:10px;align-items:center}
.toast button{margin-left:auto;background:none;border:1px solid currentColor;color:inherit;border-radius:8px;padding:3px 9px;font-weight:700}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
@keyframes clink{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(-8deg)}100%{transform:scale(1)}}
.clink{animation:clink .45s ease-out}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.pulse{animation:pulse 1.6s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function dueOnDay(r,d){
  switch(r.type){
    case 'weekly_days':return (r.days||[]).includes(wdi(d));
    case 'monthly_days':{const md=r.mdays||[];const last=daysIn(d.getFullYear(),d.getMonth());return md.includes(d.getDate())||(d.getDate()===last&&md.some(x=>x>last))}
    case 'every_n_days':{const diff=Math.round((d-pd(r.start))/864e5);return diff>=0&&diff%Math.max(1,r.every||1)===0}
    case 'yearly_dates':return (r.ydates||[]).includes(`${pad(d.getMonth()+1)}-${pad(d.getDate())}`);
    default:return true;
  }
}
function pkey(r,d){
  const p=RT[r.type].p;
  if(p==='day')return dueOnDay(r,d)?dk(d):null;
  if(p==='week')return 'W'+dk(monday(d));
  if(p==='month')return 'M'+d.getFullYear()+'-'+pad(d.getMonth()+1);
  return 'Y'+d.getFullYear();
}
const target=r=>Math.max(1,Number(r.target)||1);
function aggLog(r){
  const p=RT[r.type].p, out={};
  for(const [k,v] of Object.entries(r.log||{})){
    let key=k;
    if(p!=='day'){const d=pd(k);key=p==='week'?'W'+dk(monday(d)):p==='month'?'M'+k.slice(0,7):'Y'+k.slice(0,4)}
    out[key]=(out[key]||0)+v;
  }
  return out;
}
function periodsList(r,from,to){
  const p=RT[r.type].p,out=[];
  if(from>to)return out;
  if(p==='day'){for(let d=new Date(from);d<=to;d=addD(d,1))if(dueOnDay(r,d))out.push(dk(d))}
  else if(p==='week'){for(let d=monday(from);d<=to;d=addD(d,7))out.push('W'+dk(d))}
  else if(p==='month'){let d=new Date(from.getFullYear(),from.getMonth(),1);while(d<=to){out.push('M'+d.getFullYear()+'-'+pad(d.getMonth()+1));d=new Date(d.getFullYear(),d.getMonth()+1,1)}}
  else{for(let y=from.getFullYear();y<=to.getFullYear();y++)out.push('Y'+y)}
  return out;
}
function periodStart(r,d){const p=RT[r.type].p;if(p==='day')return d;if(p==='week')return monday(d);if(p==='month')return new Date(d.getFullYear(),d.getMonth(),1);return new Date(d.getFullYear(),0,1)}
function chainInfo(r){
  const t=today(), agg=aggLog(r), T=target(r);
  const start=pd(r.start||dk(t));
  const from=new Date(Math.max(start,addD(t,-730)));
  const prevEnd=addD(periodStart(r,t),-1);
  const past=periodsList(r,from,prevEnd);
  const cur=pkey(r,t);
  const kept=new Set(r.kept||[]),broken=new Set(r.broken||[]);
  const st=k=>(agg[k]||0)>=T?'done':kept.has(k)?'kept':broken.has(k)?'broken':'pending';
  let streak=0,pending=[];
  if(cur&&st(cur)==='done')streak++;
  for(let i=past.length-1;i>=0;i--){const s=st(past[i]);if(s==='broken')break;if(s==='done')streak++;if(s==='pending')pending.push(past[i])}
  let best=0,run=0;for(const k of past){const s=st(k);if(s==='broken'||s==='pending'&&false){run=0}else if(s==='done'){run++;best=Math.max(best,run)}if(s==='broken')run=0}
  best=Math.max(best,streak);
  const recent=past.slice(-9).map(k=>({k,s:st(k)}));
  if(cur)recent.push({k:cur,s:st(cur)==='done'?'done':'cur'});
  return {streak,best,pending:pending.reverse().slice(-30),recent,cur,val:cur?(agg[cur]||0):0,T,agg};
}
function periodLabel(r,k){
  if(k[0]==='W'){const d=pd(k.slice(1));return `${fmtDay(d)} haftası`}
  if(k[0]==='M'){const[y,m]=k.slice(1).split('-').map(Number);return `${MON[m-1]} ${y}`}
  if(k[0]==='Y')return k.slice(1);
  const d=pd(k);return `${fmtDay(d)} ${DAYS_L[wdi(d)]}`;
}

/* ============ countdown math ============ */
function dayPlanned(d,fromMin){
  const k=dk(d),ivs=[];let loose=0;
  for(const t of tasksOnDay(k)){
    if(t.done||!t.deduct||!t.dur)continue;
    const s=toMin(t.time);
    if(s==null)loose+=Number(t.dur);else ivs.push([s,s+Number(t.dur)]);
  }
  for(const r of routinesForDay(k)){
    if(!routineDeducts(r)||RT[r.type].p!=='day')continue;
    const done=routineDayVal(r,k);
    const need=r.type==='daily_count'?Math.max(0,target(r)-done)*Number(r.dur):r.type==='daily_duration'?Math.max(0,target(r)-done):(done>=1?0:Number(r.dur));
    if(!need)continue;
    const s=toMin(r.time||((r.parts||[]).length===1?(S.settings.partTimes||{})[r.parts[0]]:null));
    if(s==null)loose+=need;else ivs.push([s,s+need]);
  }
  ivs.sort((a,b)=>a[0]-b[0]);
  let total=0,cs=-1,ce=-1;
  for(let [s,e] of ivs){s=Math.max(s,fromMin);e=Math.min(e,1440);if(e<=s)continue;if(s>ce){if(ce>cs)total+=ce-cs;cs=s;ce=e}else ce=Math.max(ce,e)}
  if(ce>cs)total+=ce-cs;
  return total+loose;
}
const routineDeducts=r=>!r.paused&&r.noDeduct!==true&&(Number(r.dur)>0||r.type==='daily_duration');
function periodRoutineMinutes(end){
  const t0=today();let m=0;
  for(const r of routinesArr()){
    const p=RT[r.type].p;if(p==='day'||!routineDeducts(r)||!Number(r.dur))continue;
    if(pd(r.start||dk(t0))>=end)continue;
    let first=true;
    for(const key of periodsList(r,t0,addD(end,-1))){
      const start=key[0]==='W'?pd(key.slice(1)):key[0]==='M'?pd(key.slice(1)+'-01'):new Date(+key.slice(1),0,1);
      if(start>=end)break;
      const pEnd=key[0]==='W'?addD(start,6):key[0]==='M'?new Date(start.getFullYear(),start.getMonth()+1,0):new Date(start.getFullYear(),11,31);

/* ============ ROUTINES ============ */
function chainSvg(recent,color){
  const n=recent.length,W=Math.max(1,n)*26+10;
  let s='';
  recent.forEach((p,i)=>{
    const x=6+i*26,y=i%2?11:7,w=30,h=16;
    let stroke=color,dash='',op=1;
    if(p.s==='kept'){stroke='var(--muted)';dash='stroke-dasharray="4 3"'}
    if(p.s==='pending'){stroke='var(--line)'}
    if(p.s==='broken'){stroke='var(--danger)';op=.5;dash='stroke-dasharray="10 6"'}
    if(p.s==='cur'){stroke='var(--line)';dash='stroke-dasharray="3 3"'}
    s+=`<rect class="lk" x="${x}" y="${y}" width="${w}" height="${h}" rx="8" stroke="${stroke}" opacity="${op}" ${dash}><title>${esc(p.k)}</title></rect>`;
  });
  return `<svg class="chain" viewBox="0 0 ${W+10} 34" preserveAspectRatio="xMinYMid meet">${s}</svg>`;
}
function viewRoutines(){
  const rs=routinesArr();
  const cards=rs.map(r=>{
    const ci=chainInfo(r),p=RT[r.type].p;
    return `<div class="rcard ${r.paused?'paused':''}" data-lp="routine:${r.id}" style="--rc:${r.color}">
      <div class="top"><div style="flex:1;min-width:0"><div class="nm">${esc(r.name)}</div><div class="small muted">${RT[r.type].d(r)}${(r.parts||[]).length?` · ${PARTS.filter(x=>r.parts.includes(x[0])).map(x=>x[1]).join(', ')}`:''}${r.time?` · ${r.time}`:''}${r.dur?` · ${fmtDur(r.dur)}`:''}${r.paused?' · durduruldu':''}</div></div>
      <button class="rbtn" data-act="markRoutine" data-id="${r.id}" data-k="${dk(today())}" aria-label="Bugün işaretle">${ringSvg(ci.val/ci.T,r.color,ci.val>=ci.T)}</button></div>
      <div class="streak"><b>${ci.streak}</b><span class="muted small">${PNAME[p]} zincir · en uzun ${ci.best}</span></div>
      ${chainSvg(ci.recent,r.color)}
      <div class="btns"><button class="btn" style="padding:8px 12px" data-act="routineDetail" data-id="${r.id}">Ayrıntı</button><button class="btn" style="padding:8px 12px" data-act="editRoutine" data-id="${r.id}">Düzenle</button>${ci.pending.length?`<button class="btn gold" style="padding:8px 12px" data-act="openChains">${ci.pending.length} bekleyen</button>`:''}</div>
    </div>`;
  }).join('');
  return `<div class="head"><h1>Rutinler</h1><button class="btn pri" data-act="newRoutine">+ Yeni rutin</button></div>
  <p class="sub" style="margin-top:-6px">Her tamamlanan dönem zincire bir halka ekler. İşaretlenmeyen dönemlerde zincir sen onaylamadan kırılmaz.</p>
  ${rs.length?`<div class="rcards">${cards}</div>`:starter()}`;
}

function planLabel(t){
  if(t.scope==='none'||!t.date)return 'Planlanmadı';
  const d=pd(t.date);
  if(t.scope==='day')return `${fmtDay(d)} ${DAYS[wdi(d)]}${t.time?' · '+t.time:''}${t.dur?' · '+fmtDur(t.dur):''}`;
  if(t.scope==='week')return `${fmtDay(monday(d))} haftası`;
  if(t.scope==='month')return `${MON[d.getMonth()]} ${d.getFullYear()}`;
  return `${d.getFullYear()} yılı`;
}
function viewAll(){
  const f=UI.allF||'open',all=tasksArr().filter(t=>!isHiddenUnplanned(t));

  const dn=all.filter(t=>t.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  const list=f==='un'?un:f==='pl'?pl:f==='done'?dn:[...un,...pl];

    ${!planned&&!t.done?`<button class="plan" data-act="planTask" data-id="${t.id}">Planla</button>`:''}</div>`};
  const segs=[['open','Açık',open.length],['un','Planlanmamış',un.length],['pl','Planlı',pl.length],['done','Biten',dn.length]];

  <div class="legend"><span><i style="background:var(--surface)"></i>Planlanmadı</span><span><i style="background:var(--teal-soft);border-color:var(--teal)"></i>Planlandı (tarih verildi)</span></div>
  <div class="list">${list.map(row).join('')||`<div class="empty">${f==='done'?'Henüz biten görev yok.':'Burada görev yok. + Ekle ile yazıp gönder, sonra planlarsın.'}</div>`}</div>`;
}
function viewMatrix(seg){
  const f=UI.mxFilter,t0=today(),w0=monday(t0),wEnd=addD(w0,6);
  const inF=t=>{
    if(t.done)return false;
    if(isHiddenUnplanned(t))return false;
    if(f==='all')return true;
    if(t.scope==='none')return f!=='today';
    const e=scopeEnd(t),s=t.scope==='day'?pd(t.date):e;
    if(f==='today')return t.scope==='day'?pd(t.date)<=t0:e<=t0;
    return (t.scope==='day'?pd(t.date):e)<=wEnd||(t.scope==='week'&&monday(pd(t.date)).getTime()===w0.getTime());
  };
  const ts=sortTasks(tasksArr().filter(inF));
  const q=k=>ts.filter(t=>t.quad===k);
  const un=ts.filter(t=>!t.quad);
  const quad=k=>`<div class="quad" data-lp="color:${{ui:'q1',ni:'q2',un:'q3',nn:'q4'}[k]}" style="--qc:${QUADS[k].c}"><div style="display:flex;align-items:baseline;gap:8px"><h3>${QUADS[k].l}</h3><button class="add" style="margin-left:auto;border:0;background:none;color:var(--q2);font-weight:600" data-act="newTask" data-quad="${k}" data-scope="day" data-date="${dk(t0)}">+ Ekle</button></div><div class="hint">${QUADS[k].h}</div>${q(k).map(t=>taskRow(t,{showDate:true})).join('')||'<div class="small muted">Boş</div>'}</div>`;
  return `${seg?`<div class="head"><h1>Öncelik matrisi</h1>${seg}</div>`:''}<div class="head" ${seg?'style="margin-top:-4px"':''}>${seg?'':'<h1>Öncelik matrisi</h1>'}<div class="seg">${[['today','Bugün'],['week','Bu hafta'],['all','Tümü']].map(([k,l])=>`<button aria-pressed="${f===k}" data-act="mx" data-f="${k}">${l}</button>`).join('')}</div></div>

  ${un.length?`<div class="sec"><h2>Sınıflandırılmamış (${un.length})</h2></div><div class="list">${un.map(t=>taskRow(t,{showDate:true})).join('')}</div>`:''}`;
}

function buildPack(){
  const c=S.settings.sync.cats,p={app:'halka-planlayici',version:1,at:new Date().toISOString()};
  if(c.tasks)p.projects=projArr().map(x=>({id:x.id,name:x.name,parentId:x.parentId||null,deadline:x.deadline||null,progress:projProgress(x.id)}));
  if(c.tasks)p.tasks=tasksArr().map(t=>({id:t.id,projectId:t.projectId||null,parentTaskId:t.parentTaskId||null,deadline:t.deadline||null,progress:taskProgress(t),title:t.title,note:t.note||'',quad:t.quad||null,scope:t.scope,date:t.date||null,time:t.time||null,dur:t.dur||null,done:!!t.done,doneAt:t.doneAt||null}));
  if(c.routines||c.logs||c.chains)p.routines=routinesArr().map(r=>{
    const o={id:r.id,name:r.name};
    if(c.routines)Object.assign(o,{type:r.type,typeLabel:RT[r.type].d(r),target:r.target||1,time:r.time||null,dur:r.dur||null,start:r.start,paused:!!r.paused});
    if(c.logs)o.log=r.log||{};
    if(c.chains){const ci=chainInfo(r);o.chain={current:ci.streak,best:ci.best,unit:PNAME[RT[r.type].p]}}
    return o;
  });
  if(c.timers){const t0=today();p.plannedMinutes={day:plannedUntil(addD(t0,1)),week:plannedUntil(addD(monday(t0),7)),month:plannedUntil(new Date(t0.getFullYear(),t0.getMonth()+1,1)),year:plannedUntil(new Date(t0.getFullYear()+1,0,1))}}
  return p;
}
let syncT=null;
function scheduleSync(){clearTimeout(syncT);syncT=setTimeout(()=>doSync(true),3000)}
async function doSync(silent){
  const pack=buildPack();
  S.settings.sync.last=pack.at;
  if(MODE==='db'&&USER){const r=await sb.from('halka_items').upsert({user_id:USER.id,id:'sync_outbox',kind:'sync',data:pack,updated_at:pack.at});if(r.error){toast('Senkron kutusuna yazılamadı');return}}
  else ls.set('halka-sync-outbox',pack);
  persist('s');
  if(!silent){toast('Seçilen veriler senkron kutusuna gönderildi');render()}
}

  TE=structuredClone(t);
  const scopes=[['day','Gün'],['week','Hafta'],['month','Ay'],['year','Yıl'],['none','Planlanmadı']];
  openSheet(`${shead(isNew?'Yeni görev':'Görevi düzenle')}
    <label class="f">Görev<input class="inp" id="te-title" value="${esc(TE.title||'')}" placeholder="Görev adı"></label>
    <div class="qpick">${Object.entries(QUADS).map(([k,q])=>`<button style="--qc:${q.c}" data-act="teQuad" data-k="${k}" aria-pressed="${TE.quad===k}">${q.l}<small>${q.h}</small></button>`).join('')}</div>
    <div><div class="f" style="margin-bottom:6px;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">Ne zaman</div>
    <div class="chips" id="te-scope">${scopes.map(([k,l])=>`<button class="chip" data-act="teScope" data-k="${k}" aria-pressed="${TE.scope===k}">${l}</button>`).join('')}</div></div>
    <div id="te-when"></div>
    <div class="grid2" id="te-timegrid"><label class="f">Saat<input class="inp" type="time" id="te-time" value="${TE.time||''}"></label><label class="f">Süre (dk)<input class="inp" type="number" min="0" step="5" id="te-dur" value="${TE.dur||''}" placeholder="örn. 45"></label></div>
    <label class="toggle"><input type="checkbox" id="te-deduct" ${TE.deduct?'checked':''}><span>Bu süreyi geri sayım sayaçlarından düş</span></label>
    <div class="card" style="padding:12px;background:var(--surface2);gap:10px">
      <div class="grid2 stack"><label class="f">Son tarih<input class="inp" type="date" id="te-deadline" value="${TE.deadline||''}"></label>
      <label class="f">Hatırlatma<input class="inp" type="datetime-local" id="te-remind" value="${TE.remindAt||''}"></label></div>
      <label class="f">Proje<select class="inp" id="te-project" ${TE.parentTaskId?'disabled':''}><option value="">Proje yok</option>${projOptions(TE.projectId)}</select></label>
      ${TE.parentTaskId&&S.tasks[TE.parentTaskId]?`<div class="small muted">Üst görev: <b data-act="editTask" data-id="${TE.parentTaskId}" style="cursor:pointer;text-decoration:underline">${esc(S.tasks[TE.parentTaskId].title)}</b></div>`:''}
      <div id="te-prog"></div>
    </div>
    <div><div style="margin-bottom:6px;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">Alt görevler</div>
      <div class="list" id="te-subs"></div>
      <div class="btns" style="margin-top:6px"><input class="inp" id="te-newsub" placeholder="Alt görev ekle" style="flex:1;width:auto;min-width:0" enterkeyhint="done"><button class="btn" data-act="teAddSub">Ekle</button></div></div>
    <label class="f">Not<textarea class="inp" id="te-note">${esc(TE.note||'')}</textarea></label>
    <div class="btns"><button class="btn pri grow" data-act="teSave">Kaydet</button>${!isNew?`<button class="btn" data-act="tePostpone" data-n="1">Yarına</button><button class="btn" data-act="tePostpone" data-n="7">Haftaya</button><button class="btn danger" data-act="teDelete">Sil</button>`:''}</div>
    <div id="te-confirm"></div>`,()=>{teWhen();teSubs();teProg();$('#te-newsub').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();teAddSub()}});if(isNew)setTimeout(()=>$('#te-title').focus(),60);if(TE._timed)setTimeout(()=>$('#te-time').focus(),80)});
}
function teWhen(){
  const s=TE.scope,el=$('#te-when');if(!el)return;
  const d=TE.date?pd(TE.date):today();
  let h='';
  if(s==='day')h=`<label class="f">Tarih<input class="inp" type="date" id="te-date" value="${dk(d)}"></label>`;
  if(s==='week')h=`<label class="f">Haftanın herhangi bir günü<input class="inp" type="date" id="te-date" value="${dk(monday(d))}"></label><div class="small muted">${fmtDay(monday(d))} haftasına kaydedilir.</div>`;
  if(s==='month')h=`<label class="f">Ay<input class="inp" type="month" id="te-date" value="${d.getFullYear()}-${pad(d.getMonth()+1)}"></label>`;
  if(s==='year')h=`<label class="f">Yıl<input class="inp" type="number" id="te-date" min="2020" max="2100" value="${d.getFullYear()}"></label>`;
  if(s==='none')h=`<div class="small muted">${TE.projectId||TE.parentTaskId?'Projesinde bekler; gün, hafta, ay ya da yıl verince planına ve Görevler listesine geçer.':'Planlanmamış görevlerde bekler; istediğinde gün, hafta, ay ya da yıl atarsın.'}</div>`;
  el.innerHTML=h;
  $('#te-timegrid').hidden=s!=='day';
}
function teCollect(){
  TE.title=$('#te-title').value.trim();
  TE.note=$('#te-note').value;
  const di=$('#te-date');
  if(TE.scope==='none')TE.date=null;
  else if(di){
    const v=di.value;
    if(TE.scope==='day')TE.date=v||dk(today());
    if(TE.scope==='week')TE.date=dk(monday(v?pd(v):today()));
    if(TE.scope==='month')TE.date=(v||dk(today()).slice(0,7))+'-01';
    if(TE.scope==='year')TE.date=(v||today().getFullYear())+'-01-01';
  }
  if(TE.scope==='day'){TE.time=$('#te-time').value||null}else TE.time=null;
  const du=Number($('#te-dur').value);TE.dur=du>0?du:null;
  TE.deduct=$('#te-deduct').checked;
  TE.deadline=$('#te-deadline').value||null;
  TE.remindAt=$('#te-remind').value||null;
  const pj=$('#te-project');if(pj&&!pj.disabled)TE.projectId=pj.value||null;
  const pg=$('#te-progress');if(pg)TE.progress=Number(pg.value)||0;
}
function teSubs(){
  const el=$('#te-subs');if(!el)return;
  const ch=childTasks(TE.id);
  el.innerHTML=ch.map(c=>`<div class="mini" style="--qc:var(--teal)"><button class="check ${c.done?'on':''}" data-act="teSubToggle" data-id="${c.id}" aria-label="Tamamlandı">${IC.ok}</button><span class="t" data-act="teOpenSub" data-id="${c.id}" style="${c.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(c.title)} <span class="small ${c.scope!=='none'?'':'muted'}" style="${c.scope!=='none'?'color:var(--teal);font-weight:600':''}">· ${planLabel(c)}</span></span>${c.scope==='none'&&!c.done?`<button class="plan" data-act="teSubPlan" data-id="${c.id}">Planla</button>`:''}</div>`).join('')||'<div class="small muted">Alt görev yok.</div>';
}
function teProg(){
  const el=$('#te-prog');if(!el)return;
  const ch=childTasks(TE.id);
  if(ch.length){const pr=taskProgress(Object.assign({},TE,{done:false}));el.innerHTML=`<div class="f" style="font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">İlerleme · %${pr} <span style="text-transform:none;font-weight:500">(alt görevlerden)</span></div>${progBar(pr)}`}
  else el.innerHTML=`<label class="f">İlerleme · <span id="te-progval">%${Number(TE.progress)||0}</span><input type="range" id="te-progress" min="0" max="100" step="5" value="${Number(TE.progress)||0}" oninput="document.getElementById('te-progval').textContent='%'+this.value" style="accent-color:var(--teal)"></label>`;
}
function teStore(){
  teCollect();if(!TE.title){$('#te-title').focus();return false}
  delete TE._timed;if(!TE.created)TE.created=Date.now();
  S.tasks[TE.id]=TE;persist('t',TE.id);
  for(const cid of taskDescendants(TE.id)){const c=S.tasks[cid];if(c&&c.projectId!==TE.projectId){c.projectId=TE.projectId;persist('t',cid)}}
  return true;
}
function teAddSub(){
  const i=$('#te-newsub'),title=i.value.trim();if(!title){i.focus();return}
  if(!teStore())return;
  const c={id:uid(),title,parentTaskId:TE.id,projectId:TE.projectId||null,quad:null,scope:'none',date:null,time:null,dur:null,deduct:false,done:false,progress:0,created:Date.now()};
  S.tasks[c.id]=c;persist('t',c.id);i.value='';i.focus();teSubs();teProg();render();
}
function teSave(){
  if(!teStore())return;
  closeSheet();render();toast('Kaydedildi');
}

/* routine editor */

function newRoutineObj(){return {id:uid(),name:'',color:COLORS[routinesArr().length%COLORS.length],type:'daily_count',target:1,days:[0,2,4],mdays:[1,15],every:2,ydates:[],start:dk(today()),time:null,dur:null,deduct:false,reminders:{times:[],eod:true,eow:false,days:[]},log:{},kept:[],broken:[],paused:false,created:Date.now()}}

      <div class="wdpick">${DAYS.map((x,i)=>`<button data-act="reRemDay" data-i="${i}" aria-pressed="${RE.reminders.days.includes(i)}">${x}</button>`).join('')}</div>

function reParams(){

  if(['daily_count','weekly_count','monthly_count','yearly_count'].includes(t))h=`<label class="f">Kaç kez<input class="inp" type="number" min="1" id="re-target" value="${RE.target||1}"></label>`;

function reTimes(){const el=$('#re-times');if(el)el.innerHTML=RE.reminders.times.map(x=>`<button class="chip" data-act="reDelTime" data-v="${x}">${x} ✕</button>`).join('')||'<span class="small muted">Saatli hatırlatma yok</span>'}
function reCollect(){
  RE.name=$('#re-name').value.trim();
  const tg=$('#re-target');if(tg)RE.target=Math.max(1,Number(tg.value)||1);
  if(!['daily_count','weekly_count','monthly_count','yearly_count','daily_duration'].includes(RE.type))RE.target=1;
  const ev=$('#re-every');if(ev)RE.every=Math.max(2,Number(ev.value)||2);

function reSave(){
  reCollect();if(!RE.name){$('#re-name').focus();return}

  if(RE.type==='yearly_dates'&&!RE.ydates.length){toast('En az bir tarih ekle');return}
  delete RE._new;delete RE._applied;
  S.routines[RE.id]=RE;persist('r',RE.id);closeSheet();render();toast('Rutin kaydedildi');
}

/* clock info */
function routineStatus(r,k){
  const p=RT[r.type].p,d=today();
  if(r.paused)return {ok:false,why:'durdurulmuş'};
  if(r.noDeduct===true)return {ok:false,why:'“sayaçtan düş” kapalı',fix:'on'};
  if(!(Number(r.dur)>0)&&r.type!=='daily_duration')return {ok:false,why:'süre girilmemiş',fix:'dur'};
  if(pd(r.start||dk(d))>d)return {ok:false,why:'henüz başlamadı'};
  if(p==='day'){
    if(!dueOnDay(r,d))return {ok:true,why:'bugün yok, ileriki günlerde düşülür',min:0};
    const done=routineDayVal(r,dk(d));
    const need=r.type==='daily_count'?Math.max(0,target(r)-done)*Number(r.dur):r.type==='daily_duration'?Math.max(0,target(r)-done):(done>=1?0:Number(r.dur));
    if(!need)return {ok:true,why:'bugün tamamlandı',min:0};
    const t=r.time||((r.parts||[]).length===1?(S.settings.partTimes||{})[r.parts[0]]:null);
    const nowMin=new Date().getHours()*60+new Date().getMinutes();
    if(t&&toMin(t)+need<=nowMin)return {ok:true,why:`saati (${t}) geçti, bugün düşülmez`,min:0};
    return {ok:true,why:t?`bugün ${t}`:'bugün, saatsiz',min:need};
  }
  return {ok:true,why:`${PNAME[p]}lık · ${PNAME[p]} sayacından düşülür`,min:Math.max(0,target(r)-(aggLog(r)[pkey(r,d)]||0))*Number(r.dur)};
}
function openClockInfo(k){

function markRoutine(r,k,btn){
  const d=pd(k);if(d>today())return;
  if(r.type==='daily_duration'){openDurLog(r,k);return}
  const T=target(r),before=routinePeriodVal(r,d);
  r.log=r.log||{};
  const slot=btn?.dataset.slot;
  if(slot!=null&&slot!==''&&(r.log[k]||0)>+slot){
    r.log[k]--;if(!r.log[k])delete r.log[k];persist('r',r.id);render();toast('İşaret geri alındı');return;
  }
  if(before>=T&&(RT[r.type].p==='day'||routineDayVal(r,k)>0)&&T===1){
    r.log[k]=Math.max(0,(r.log[k]||0)-1);if(!r.log[k])delete r.log[k];
    persist('r',r.id);render();toast('İşaret geri alındı');return;
  }
  if(before>=T&&T>1){
    if(routineDayVal(r,k)>0){r.log[k]--;if(!r.log[k])delete r.log[k];persist('r',r.id);render();toast('Bir işaret geri alındı');return}
    return;
  }
  r.log[k]=(r.log[k]||0)+1;
  r.broken=(r.broken||[]).filter(x=>x!==pkey(r,d));
  persist('r',r.id);
  const after=routinePeriodVal(r,d);
  celebrate(btn,r,after>=T);
  render();
}
function addDur(r,k,m){r.log=r.log||{};const before=r.log[k]||0;r.log[k]=Math.max(0,before+m);if(!r.log[k])delete r.log[k];persist('r',r.id);if(before<target(r)&&(r.log[k]||0)>=target(r))celebrate(null,r,true);render()}
function celebrate(btn,r,complete){
  if(btn){const s=btn.querySelector('svg');s&&s.classList.add('clink')}
  if(complete){
    const ci=chainInfo(r);
    toast(`Halka eklendi · ${r.name}: ${ci.streak} ${PNAME[RT[r.type].p]} zincir`);
    const rect=btn?btn.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};
    burst(rect.left+rect.width/2,rect.top+rect.height/2,r.color,ci.streak);
  }
}
function toggleTask(t,btn){
  t.done=!t.done;t.doneAt=t.done?Date.now():null;persist('t',t.id);
  if(t.done){btn&&btn.classList.add('on');const rc=btn?.getBoundingClientRect();if(rc)burst(rc.left+rc.width/2,rc.top+rc.height/2,getComputedStyle(btn).getPropertyValue('--qc')||'#2B67CF',3)}
  setTimeout(render,t.done?220:0);
  if(t.done){const st=dayStats(dk(today()));if(st.done===st.goal){setTimeout(()=>{burst(innerWidth/2,innerHeight/3,getComputedStyle(document.documentElement).getPropertyValue('--accent'),18);toast(`Günün halkası tamam · ${st.streak} gün üst üste`)},260);return}}
  toast(t.done?'Tamamlandı':'Tekrar açıldı',t.done?()=>{t.done=false;t.doneAt=null;persist('t',t.id);render()}:null);
}

    case 'askNotif':if('Notification' in window){Notification.requestPermission().then(p=>{render();toast(p==='granted'?'Bildirimler açık':'Bildirim izni verilmedi')}).catch(()=>toast('Bildirim izni alınamadı'))}else toast('Bu cihaz bildirimleri desteklemiyor. iPhone ve iPad\'de önce uygulamayı ana ekrana ekle.');break;

    case 'hideInstall':ls.set('halka-hideinstall',true);render();break;
    case 'installHelp':{

      const ua=navigator.userAgent,ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1),safari=/Safari/.test(ua)&&!/CriOS|FxiOS|EdgiOS/.test(ua),android=/Android/.test(ua);

const PCOLORS=['#2F5D50','#4C6A8C','#A8823A','#A9524A','#6B5B8C','#5E7A4A','#5C6066'];
const projArr=()=>Object.values(S.projects).filter(p=>!p.archived).sort((a,b)=>(a.created||0)-(b.created||0));
const subProjects=pid=>projArr().filter(p=>(p.parentId||null)===(pid||null));
const projTopTasks=pid=>tasksArr().filter(t=>t.projectId===pid&&!t.parentTaskId).sort((a,b)=>(a.done-b.done)||((a.created||0)-(b.created||0)));
const childTasks=id=>tasksArr().filter(t=>t.parentTaskId===id).sort((a,b)=>(a.created||0)-(b.created||0));
const isLoose=t=>t.scope==='none'&&!t.projectId&&!t.parentTaskId;
const isHiddenUnplanned=t=>t.scope==='none'&&(t.projectId||t.parentTaskId);
function taskProgress(t,d=0){
  if(t.done)return 100;
  const ch=d<6?childTasks(t.id):[];
  if(ch.length)return Math.round(ch.reduce((s,c)=>s+taskProgress(c,d+1),0)/ch.length);
  return Math.max(0,Math.min(100,Number(t.progress)||0));
}
function projProgress(pid,d=0){
  const v=[...projTopTasks(pid).map(t=>taskProgress(t)),...(d<6?subProjects(pid).map(p=>projProgress(p.id,d+1)):[])];
  return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0;
}
function projAllTasks(pid,d=0){
  let out=tasksArr().filter(t=>t.projectId===pid);
  if(d<6)for(const sp of subProjects(pid))out=out.concat(projAllTasks(sp.id,d+1));
  return out;
}
function projPath(pid){const out=[];let p=S.projects[pid],g=0;while(p&&g++<8){out.unshift(p);p=S.projects[p.parentId]}return out}
function projDescendants(pid,d=0){let out=[];if(d>8)return out;for(const sp of Object.values(S.projects).filter(p=>p.parentId===pid)){out.push(sp.id);out=out.concat(projDescendants(sp.id,d+1))}return out}
function taskDescendants(id,d=0){let out=[];if(d>8)return out;for(const c of tasksArr().filter(t=>t.parentTaskId===id)){out.push(c.id);out=out.concat(taskDescendants(c.id,d+1))}return out}
function deadlineBadge(dl){
  if(!dl)return '';
  const diff=Math.round((pd(dl)-today())/864e5);
  const cls=diff<0?'late':diff<=2?'soon':'';
  const txt=diff<0?`${-diff} gün gecikti`:diff===0?'Son gün bugün':diff===1?'Son gün yarın':`Son tarih ${fmtDay(pd(dl))}`;
  return `<span class="dl ${cls}">${txt}</span>`;
}
const progBar=(p,c)=>`<div class="pbar"><i style="width:${p}%;background:${c||'var(--teal)'}"></i></div>`;
function projName(pid){const p=S.projects[pid];return p?p.name:''}
function projChip(t){const p=S.projects[t.projectId];return p?`<span class="pchip" style="--pc:${p.color}">${esc(p.name)}</span>`:''}
function remindTxt(t){if(!t.remindAt)return '';const d=new Date(t.remindAt);return `<span class="mono">${IC.bell.replace('<svg','<svg width="12" height="12" style="vertical-align:-1px"')} ${d.getDate()} ${MON[d.getMonth()].slice(0,3)} ${pad(d.getHours())}:${pad(d.getMinutes())}</span>`}
function dueSoonTasks(){const t0=today();return tasksArr().filter(t=>!t.done&&t.deadline&&Math.round((pd(t.deadline)-t0)/864e5)<=1)}

function viewProjects(){
  if(UI.proj&&S.projects[UI.proj])return viewProject(UI.proj);
  UI.proj=null;
  const tops=subProjects(null);
  const card=p=>{
    const all=projAllTasks(p.id),dn=all.filter(t=>t.done).length,pr=projProgress(p.id),subs=subProjects(p.id).length;

}
function projTaskRows(t,depth){
  const ch=childTasks(t.id),pr=taskProgress(t),planned=t.scope!=='none';
  const meta=[];
  if(planned)meta.push(`<span class="planned-tag">Planda: ${planLabel(t)}</span>`);
  if(t.deadline)meta.push(deadlineBadge(t.deadline));
  if(t.remindAt)meta.push(remindTxt(t));
  if(ch.length)meta.push(`${ch.filter(c=>c.done).length}/${ch.length} alt görev`);
  const showProg=ch.length||(Number(t.progress)>0&&!t.done);
  let h=`<div class="prow ${t.done?'done':''} ${planned?'planned':''}" style="margin-left:${depth*22}px">
    <button class="check ${t.done?'on':''}" style="--qc:var(--teal)" data-act="toggleTask" data-id="${t.id}" aria-label="Tamamlandı">${IC.ok}</button>
    <div class="body" data-act="editTask" data-id="${t.id}"><div class="t">${esc(t.title)}</div>${meta.length?`<div class="m">${meta.join(' ')}</div>`:''}${showProg?`<div class="pline">${progBar(pr)}<span>%${pr}</span></div>`:''}</div>
    ${!planned&&!t.done?`<button class="plan" data-act="planTask" data-id="${t.id}">Planla</button>`:''}
  </div>`;
  if(depth<3)for(const c of ch)h+=projTaskRows(c,depth+1);
  return h;
}
function viewProject(id){

  <div class="sec"><h2>Görevler</h2></div>

  <p class="small muted">Bir göreve dokunarak son tarih, hatırlatma, ilerleme ve alt görev ekleyebilirsin. “Planla” dediğin görev günlük planına ve Görevler listesine geçer.</p>`;

function noteDesc(id,d=0){let o=[];if(d>8)return o;for(const c of notesArr().filter(n=>n.parentId===id)){o.push(c.id);o=o.concat(noteDesc(c.id,d+1))}return o}
function noteDepth(id){let d=0,n=S.notes[id];while(n&&n.parentId&&S.notes[n.parentId]&&d<8){d++;n=S.notes[n.parentId]}return d}

/* ============ MOTIVATION ============ */
function doneByDay(){const m={};for(const t of tasksArr()){if(t.done&&t.doneAt){const k=dk(new Date(t.doneAt));m[k]=(m[k]||0)+1}}return m}
function dayStats(k){
  const goal=Math.max(1,Number(S.settings.dailyGoal)||3),m=doneByDay(),done=m[k]||0;
  const added=tasksArr().filter(t=>t.created&&dk(new Date(t.created))===k).length;
  let streak=0,d=pd(k);
  if(done>=goal)streak=1;
  for(let i=1;i<400;i++){const x=dk(addD(d,-i));if((m[x]||0)>=goal)streak++;else break}
  return {goal,done,added,streak,m};
}
function motivCard(){
  const k=dk(today()),st=dayStats(k),f=Math.min(1,st.done/st.goal),R=32,C=2*Math.PI*R;
  const msg=st.done>=st.goal?(st.done>st.goal?`Hedefin üstündesin: ${st.done} görev bitti.`:'Günün halkası tamam.'):st.done===0&&st.added===0?'Aklındaki ilk işi ekleyerek başla.':st.done===0?'İlk görevi bitir, halka dönmeye başlasın.':`${st.goal-st.done} görev daha, halka kapanıyor.`;
  const w0=monday(today());
  const week=Array.from({length:7},(_,i)=>{const d=addD(w0,i),dk_=dk(d),n=st.m[dk_]||0;return `<span><i class="${n>=st.goal?'full':n>0?'part':''} ${dk_===k?'today':''}" title="${n} görev"></i>${DAYS[i].slice(0,2)}</span>`}).join('');
  const rts=routinesForDay(k),rDone=rts.filter(r=>routinePeriodVal(r,today())>=target(r)).length;
  return `<div class="motiv" data-lp="sec:motiv">
    <button class="mring" data-act="setGoal" aria-label="Günlük hedefi değiştir"><svg viewBox="0 0 78 78"><circle cx="39" cy="39" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="7"/><circle cx="39" cy="39" r="${R}" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C*f} ${C}" transform="rotate(-90 39 39)" style="transition:stroke-dasharray .5s"/></svg><span class="c"><span>${st.done}/${st.goal}<small>hedef</small></span></span></button>
    <div style="min-width:0"><div class="mt">${msg}</div><div class="ms">Bugün ${st.added} görev ekledin${rts.length?` · rutinler ${rDone}/${rts.length}`:''}</div><div class="week">${week}</div></div>
    <div class="mstreak" data-lp="color:chain"><b>${st.streak}</b><span>gün</span></div>
  </div>`;
}

const trLow=s=>(s||'').toLocaleLowerCase('tr');
function findSug(name){
  const n=' '+trLow(name)+' ';if(n.trim().length<2)return null;
  for(const sg of RSUG){
    if(sg.k.some(k=>n.includes(trLow(k))))return sg;
    if((sg.w||[]).some(w=>new RegExp('(^|\\s)'+w+'(\\s|$)').test(n.trim())))return sg;
  }
  return null;
}
function reSugRender(){
  const el=$('#re-sug');if(!el)return;

/* ============ MEAL PLANNER ============ */
const MEAL_SLOTS=[['kahvalti','Kahvaltı'],['ogle','Öğle'],['aksam','Akşam'],['ara','Ara öğün']];
const mealDay=k=>S.meals[k]||{date:k,slots:{}};
const mealItems=(k,slot)=>(mealDay(k).slots||{})[slot]||[];
function mealNameStats(){const m={};for(const d of Object.values(S.meals))for(const arr of Object.values(d.slots||{}))for(const it of arr){const n=it.name.trim();if(!n)continue;const key=trLow(n);m[key]=m[key]||{name:n,c:0,ing:''};m[key].c++;if(it.ing)m[key].ing=it.ing}return Object.values(m).sort((a,b)=>b.c-a.c)}
function saveMealDay(k,day){
  const empty=!Object.values(day.slots||{}).some(a=>a&&a.length);
  if(empty){delete S.meals[k]}else{day.date=k;S.meals[k]=day}
  persist('m',k);
}
function mealSummary(k){return MEAL_SLOTS.map(([s,l])=>{const it=mealItems(k,s);return it.length?`<span class="ms-slot"><b>${l[0]}</b> ${esc(it.map(x=>x.name).join(', '))}</span>`:''}).filter(Boolean).join('')}
function viewMeals(){

  let title,body;
  if(mode==='week'){
    const w0=monday(a);title=`${fmtDay(w0)} – ${fmtDay(addD(w0,6))}`;
    body=Array.from({length:7},(_,i)=>{
      const d=addD(w0,i),k=dk(d);
      return `<div class="mealday ${k===t0?'today':''} ${k<t0?'past':''}">

        ${MEAL_SLOTS.map(([s,l])=>`<div class="mslot"><span class="mlabel">${l}</span><div class="mitems">${mealItems(k,s).map(it=>`<button class="mchip" data-act="mealEdit" data-k="${k}" data-s="${s}" data-id="${it.id}">${esc(it.name)}</button>`).join('')}<button class="madd" data-act="mealAdd" data-k="${k}" data-s="${s}" aria-label="${l} ekle">+</button></div></div>`).join('')}
      </div>`;
    }).join('');
    body=`<div class="btns" style="margin-bottom:12px"><button class="btn" data-act="mealCopyWeek">Geçen haftayı kopyala</button><button class="btn" data-act="mealShop">Alışveriş listesi</button></div><div class="list">${body}</div>`;
  }else{
    const y=a.getFullYear(),m=a.getMonth();title=`${MON[m]} ${y}`;
    const n=daysIn(y,m);
    body=`<div class="btns" style="margin-bottom:12px"><button class="btn" data-act="mealShop">Alışveriş listesi</button></div><div class="mmonth">${Array.from({length:n},(_,i)=>{const d=new Date(y,m,i+1),k=dk(d),sum=mealSummary(k);return `<button class="mrow ${k===t0?'today':''}" data-act="mealOpenWeek" data-k="${k}"><span class="mdate"><b>${i+1}</b><small>${DAYS[wdi(d)]}</small></span><span class="msum">${sum||'<span class="muted">Plan yok</span>'}</span></button>`}).join('')}</div>`;
  }
  const filled=Object.keys(S.meals).filter(k=>k>=t0).sort();
  const ahead=filled.length?Math.round((pd(filled[filled.length-1])-today())/864e5)+1:0;
  return `<div class="head"><h1>Yemek planı</h1>${seg}</div>
  <div class="head" style="margin-top:-4px"><button class="iconbtn" data-act="mealNav" data-n="-1" aria-label="Önceki">${IC.left}</button><span style="flex:1;font-weight:700;text-align:center">${title}</span><button class="iconbtn" data-act="mealNav" data-n="1" aria-label="Sonraki">${IC.right}</button></div>
  ${ahead?`<div class="small muted" style="margin:-4px 0 10px">${ahead} gün ilerisine kadar planın var.</div>`:'<div class="small muted" style="margin:-4px 0 10px">Bir öğüne + ile yemek ekle; bir aya kadar önceden planlayabilirsin.</div>'}
  ${body}`;
}
let ME=null;

  const day=structuredClone(mealDay(k));day.slots=day.slots||{};

function mealSave(){

function mealCopyWeek(){
  const w0=monday(pd(UI.mealAnchor||dk(today())));let n=0;
  for(let i=0;i<7;i++){
    const k=dk(addD(w0,i)),src=mealDay(dk(addD(w0,i-7))),day=structuredClone(mealDay(k));day.slots=day.slots||{};
    for(const [s] of MEAL_SLOTS){const from=(src.slots||{})[s]||[];if(from.length&&!(day.slots[s]||[]).length){day.slots[s]=from.map(x=>({id:uid(),name:x.name,ing:x.ing||''}));n++}}
    saveMealDay(k,day);
  }
  render();toast(n?`${n} öğün kopyalandı (dolu öğünlere dokunulmadı)`:'Geçen hafta kopyalanacak öğün yok');
}
let SHOP={range:'week'};
function shopRange(r){
  const t0=today(),a=pd(UI.mealAnchor||dk(t0));
  if(r==='week'){const w=monday(a);return [w,addD(w,6)]}
  if(r==='next'){const w=addD(monday(a),7);return [w,addD(w,6)]}
  if(r==='2w'){return [t0,addD(t0,13)]}
  return [t0,addD(t0,29)];
}
function shopItems(r){
  const [a,b]=shopRange(r),ing=new Map(),noIng=new Set();
  for(let d=new Date(a);d<=b;d=addD(d,1)){
    const day=mealDay(dk(d));
    for(const arr of Object.values(day.slots||{}))for(const it of arr){
      const parts=(it.ing||'').split(/[,\n]/).map(x=>x.trim()).filter(Boolean);
      if(!parts.length)noIng.add(it.name);
      for(const p of parts){const key=trLow(p);if(!ing.has(key))ing.set(key,p)}
    }
  }
  return {a,b,ing:[...ing.values()],noIng:[...noIng]};
}
function openShop(){
  const r=SHOP.range,x=shopItems(r);
  const ranges=[['week','Bu hafta'],['next','Gelecek hafta'],['2w','2 hafta'],['month','30 gün']];

    ${x.noIng.length?`<div class="small muted">Malzemesi girilmemiş: ${esc(x.noIng.join(', '))}</div>`:''}

}

  S.notes[g.id]=g;persist('c',g.id);
  x.ing.forEach((t,i)=>{const n={id:uid(),text:t,done:false,created:Date.now()+i,parentId:g.id};S.notes[n.id]=n;persist('c',n.id)});

function todayMealsCard(){

/* ============ toast / fx ============ */
function toast(msg,undo){
  const el=document.createElement('div');el.className='toast';el.innerHTML=`<span>${esc(msg)}</span>${undo?'<button>Geri al</button>':''}`;
  if(undo)el.querySelector('button').onclick=()=>{undo();el.remove()};
  $('#toasts').appendChild(el);setTimeout(()=>el.remove(),undo?5000:3200);
}
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],raf=0;
function burst(x,y,color,n){
  if(RM)return;
  cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const cols=[color.trim()||'#D99A0B',getComputedStyle(document.documentElement).getPropertyValue('--gold').trim(),getComputedStyle(document.documentElement).getPropertyValue('--teal').trim()];
  const count=Math.min(70,18+n*3);
  for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*5;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2.5,life:1,r:3+Math.random()*4,c:cols[i%3],ring:Math.random()<.4})}
  if(!raf)raf=requestAnimationFrame(step);
}
function step(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.vx*=.98;p.life-=.016;cx.globalAlpha=Math.max(0,p.life);
    if(p.ring){cx.strokeStyle=p.c;cx.lineWidth=2.4;cx.beginPath();cx.ellipse(p.x,p.y,p.r*1.6,p.r,0,0,Math.PI*2);cx.stroke()}
    else{cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.r,p.r)}}
  cx.globalAlpha=1;
  raf=parts.length?requestAnimationFrame(step):0;
  if(!raf)cx.clearRect(0,0,innerWidth,innerHeight);
}

/* ============ reminders ============ */
const fired=new Set(ls.get('halka-fired-'+dk(today()),[]));
function remind(title,body){
  toast(`${title}: ${body}`);
  try{
    if('Notification' in window&&Notification.permission==='granted'){
      const opts={body,icon:'icon-192.png',badge:'icon-192.png',tag:title+body};
      if(navigator.serviceWorker?.controller)navigator.serviceWorker.ready.then(r=>r.showNotification(title,opts)).catch(()=>new Notification(title,opts));
      else new Notification(title,opts);
    }
  }catch(e){}
}
function checkReminders(){
  const now=new Date(),k=dk(today()),hm=`${pad(now.getHours())}:${pad(now.getMinutes())}`,st=S.settings;
  const fire=(key,title,body)=>{if(fired.has(key))return;fired.add(key);ls.set('halka-fired-'+k,[...fired]);remind(title,body)};
  for(const r of routinesArr()){
    if(r.paused)continue;
    const p=RT[r.type].p,d=today();
    if(pd(r.start)>d)continue;
    if(p==='day'&&!dueOnDay(r,d))continue;
    const met=routinePeriodVal(r,d)>=target(r);
    if(met)continue;
    const rm=r.reminders||{};
    const dayOk=!rm.days||!rm.days.length||rm.days.includes(wdi(d));
    for(const t of rm.times||[])if(dayOk&&t===hm)fire(`${r.id}|${k}|${t}`,r.name,'Zincire bir halka ekleme zamanı');
    if(r.time&&dayOk&&!(rm.times||[]).length&&r.time===hm)fire(`${r.id}|${k}|own`,r.name,'Rutin saati geldi');
    if(rm.parts&&dayOk){(r.parts||[]).forEach((pk,i)=>{const pt=(st.partTimes||{})[pk];if(pt===hm&&!(r.type==='daily_count'&&r.parts.length>1&&routineDayVal(r,k)>PARTS.map(x=>x[0]).filter(x=>r.parts.includes(x)).indexOf(pk)))fire(`${r.id}|${k}|${pk}`,r.name,partName(pk)+' rutini')})}
    if(rm.eod&&hm===st.eodTime)fire(`${r.id}|${k}|eod`,r.name,'Bugün henüz işaretlenmedi');
    if(rm.eow&&wdi(d)===+st.eowDay&&hm===st.eowTime)fire(`${r.id}|${k}|eow`,r.name,'Bu hafta hedefini tamamlamadın');
  }
  for(const t of tasksArr()){
    if(t.done)continue;
    if(t.remindAt){const at=new Date(t.remindAt);if(now>=at&&now-at<3*36e5)fire(`rem${t.id}|${t.remindAt}`,t.title,'Hatırlatma'+(t.deadline?` · son tarih ${fmtDay(pd(t.deadline))}`:''))}
    if(t.deadline===k&&hm>='09:00')fire(`dl${t.id}|${k}`,t.title,'Son tarih bugün');
  }
  for(const t of tasksOnDay(k)){
    if(t.done||!t.time)continue;
    const at=toMin(t.time)-(+st.taskLead||0),cur=now.getHours()*60+now.getMinutes();
    if(cur===at)fire(`t${t.id}|${k}`,t.title,st.taskLead?`${st.taskLead} dk sonra başlıyor (${t.time})`:'Başlama zamanı');
  }
}
